name: Deploy app on Github Pages

on:
    push:
        branches:
            - master
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install pnpm
              uses: pnpm/setup@v2
              with:
                  version: ^12.0.0
                  runtime: node@26
            - name: Setup Pages
              uses: actions/configure-pages@v5
            - name: Install dependencies
              run: pnpm ci
            - name: Build
              run: pnpm run build
            - name: Upload build artifact
              uses: actions/upload-pages-artifact@v3
              id: deployment
              with:
                  path: build

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to Github Pages
              id: deployment
              uses: actions/deploy-pages@v4
